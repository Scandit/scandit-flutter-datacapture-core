plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.scandit.datacapture.gradle-code-quality-plugin"
}

scanditCodeQuality {
    detekt {
        inputFilesDir = file('../../../android').toString()
    }
}

android {
    namespace "com.scandit.scandit_flutter_datacapture_core_example"
    compileSdk 36
    ndkVersion '27.0.12077973'

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.scandit.scandit_flutter_datacapture_core_example"
        minSdkVersion 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        languageVersion = "1.8"
        jvmTarget = "17"
    }
}

flutter {
    source '../..'
}
